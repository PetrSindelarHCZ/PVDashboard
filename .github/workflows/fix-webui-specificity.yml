name: Fix WebUI specificity

permissions:
  contents: write

on:
  push:
    branches: [master]
    paths:
      - 'scripts/fix-webui-specificity.py'
      - '.github/workflows/fix-webui-specificity.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply specificity fix
        run: python scripts/fix-webui-specificity.py

      - name: Validate selectors
        run: |
          grep -q '.btn.btn-inline' src/network/WebServer.cpp
          grep -q '.source-grid.source-grid-wide' src/network/WebServer.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.2.0'

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/network/WebServer.cpp
          git commit -m 'Fix WebUI control sizing specificity'
          git push origin master
