name: Expand timezone options

permissions:
  contents: write

on:
  push:
    branches: [master]
    paths:
      - 'scripts/expand-timezone-options.py'
      - '.github/workflows/expand-timezones.yml'

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Expand timezone list
        run: python scripts/expand-timezone-options.py

      - name: Validate timezone coverage
        run: |
          grep -q 'UTC−12 — Baker Island' src/network/WebServer.cpp
          grep -q 'UTC+14 — Kiritimati' src/network/WebServer.cpp
          grep -q 'UTC+05:45 — Kathmandu' src/network/WebServer.cpp
          grep -q 'UTC+12:45 — Chatham Islands' src/network/WebServer.cpp
          grep -q 'Praha, Bratislava, Berlín, Vídeň' src/network/WebServer.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.2.0'

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Commit WebUI changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/network/WebServer.cpp
          git commit -m 'Expand timezone selector to all UTC offsets'
          git push origin master
