name: Apply WebUI usability tweaks

permissions:
  contents: write

on:
  push:
    branches: [master]
    paths:
      - 'scripts/apply-webui-usability-tweaks.py'
      - '.github/workflows/apply-webui-usability-tweaks.yml'

jobs:
  apply-tweaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply WebUI tweaks
        run: python scripts/apply-webui-usability-tweaks.py

      - name: Validate WebUI markers
        run: |
          grep -q 'Full refresh' src/network/WebServer.cpp
          grep -q 'Střední Evropa' src/network/WebServer.cpp
          grep -q 'source-grid-wide' src/network/WebServer.cpp
          ! grep -q '<div class="card-title">Ovládání displeje</div>' src/network/WebServer.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.2.0'

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Commit WebUI changes
        shell: bash
        run: |
          if git diff --quiet -- src/network/WebServer.cpp; then
            echo 'No WebUI changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/network/WebServer.cpp
          git commit -m 'Refine WebUI controls and settings'
          git push origin master
