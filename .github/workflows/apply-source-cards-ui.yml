name: Apply data source cards UI

permissions:
  contents: write

on:
  push:
    branches: [master]
    paths:
      - 'scripts/apply-source-cards-ui.py'
      - '.github/workflows/apply-source-cards-ui.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply source card UI
        run: python scripts/apply-source-cards-ui.py

      - name: Validate UI markers
        run: |
          grep -q 'source-device-grid' src/network/WebServer.cpp
          grep -q '☀️ GoodWe' src/network/WebServer.cpp
          grep -q '♨️ AZRouter' src/network/WebServer.cpp
          grep -q 'Uložit datové zdroje a restartovat' src/network/WebServer.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.2.0'

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Commit WebUI changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/network/WebServer.cpp
          git commit -m 'Split data source settings into GoodWe and AZRouter cards'
          git push origin master
