name: Generate KPI font candidates

on:
  push:
    branches:
      - feature/dashboard-tech-font
    paths:
      - "tools/fonts/kpi-candidates/**"
      - "tools/generate-kpi-font-candidates.py"
      - ".github/workflows/generate-kpi-font-candidates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[generated-fonts]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dashboard-tech-font
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow fonttools
      - run: python tools/generate-kpi-font-candidates.py
      - name: Commit generated header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/display/fonts/KpiFontCandidates.h
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Generate KPI font candidate faces [generated-fonts]"
            git push origin HEAD:feature/dashboard-tech-font
          fi
