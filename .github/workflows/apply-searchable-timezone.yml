name: Apply searchable timezone UI

permissions:
  contents: write

on:
  push:
    branches: [master]
    paths:
      - 'scripts/apply-searchable-timezone.py'
      - '.github/workflows/apply-searchable-timezone.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply searchable timezone picker
        run: python scripts/apply-searchable-timezone.py

      - name: Validate UI markers
        run: |
          grep -q 'systemTimezoneSearch' src/network/WebServer.cpp
          grep -q 'timezone-results' src/network/WebServer.cpp
          grep -q 'filterTimezones' src/network/WebServer.cpp
          grep -q 'Vyber časové pásmo ze seznamu' src/network/WebServer.cpp
          grep -q 'UTC+05:30 — Dillí, Bombaj, Indie' src/network/WebServer.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.2.0'

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Commit WebUI changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/network/WebServer.cpp
          git commit -m 'Add searchable timezone picker'
          git push origin master
