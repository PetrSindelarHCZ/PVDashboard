name: Release Firmware

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PLATFORMIO_CORE_VERSION: '6.2.0'
  PLATFORMIO_PLATFORM: 'platformio/espressif32@7.1.3'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned PlatformIO
        run: python -m pip install "platformio==${PLATFORMIO_CORE_VERSION}"

      - name: Build firmware
        run: pio run -e esp32dev

      - name: Prepare and validate release assets
        shell: bash
        run: |
          expected_version=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            expected_version="${GITHUB_REF_NAME#v}"
          fi
          python scripts/prepare-release.py \
            --firmware .pio/build/esp32dev/firmware.bin \
            --output dist \
            --expected-version "${expected_version}" \
            --platformio-core "${PLATFORMIO_CORE_VERSION}" \
            --platform "${PLATFORMIO_PLATFORM}"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/firmware.bin
            dist/firmware.bin.sha256
            dist/dashboard-manifest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
