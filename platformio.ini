[env:esp32dev]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 921600

; PVDashboard stores configuration in Preferences/NVS and does not use SPIFFS.
; min_spiffs keeps two OTA application slots while increasing each slot from
; 1.25 MiB to 1.875 MiB on the 4 MiB ESP32 module.
board_build.partitions = min_spiffs.csv

platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
    platformio/tool-esptoolpy@2.41100.260830
    platformio/tool-mkfatfs@2.0.1
    platformio/tool-mklittlefs@1.203.210628
    platformio/tool-mkspiffs@2.230.0
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
lib_deps = 
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BME280 Library@2.3.0
    bblanchon/ArduinoJson@7.4.3
    olikraus/U8g2_for_Adafruit_GFX@1.8.0
